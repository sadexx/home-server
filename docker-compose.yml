services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${PORTAINER_HTTPS_PORT}:${PORTAINER_HTTPS_PORT}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/portainer:/data
    networks:
      - lan

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      DOMAIN: ${VAULTWARDEN_DOMAIN}
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED}
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}
      WEBSOCKET_ENABLED: "true"
    volumes:
      - ./data/vaultwarden:/data
    ports:
      - "${VAULTWARDEN_BIND_ADDR}:${VAULTWARDEN_HTTP_PORT}:80"
    networks:
      - lan

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${PIHOLE_DNS_BIND_ADDR}:${PIHOLE_DNS_PORT}:53/tcp"
      - "${PIHOLE_DNS_BIND_ADDR}:${PIHOLE_DNS_PORT}:53/udp"
      - "127.0.0.1:${PIHOLE_HTTP_PORT}:80/tcp"
    environment:
      TZ: ${PIHOLE_TZ}
      FTLCONF_webserver_api_password: ${PIHOLE_ADMIN_PASSWORD}
      FTLCONF_dns_listeningMode: 'ALL'
    volumes:
      - ./data/pihole/etc-pihole:/etc/pihole
      - ./data/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN
    networks:
      - lan
 
  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: omniroute
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${OMNIROUTE_PORT}:${OMNIROUTE_PORT}"
    environment:
      JWT_SECRET: ${OMNIROUTE_JWT_SECRET}
      API_KEY_SECRET: ${OMNIROUTE_API_KEY_SECRET}
      INITIAL_PASSWORD: ${OMNIROUTE_INITIAL_PASSWORD}
      STORAGE_ENCRYPTION_KEY: ${OMNIROUTE_STORAGE_ENCRYPTION_KEY}
      DATA_DIR: /data
      PORT: ${OMNIROUTE_PORT}
      NODE_ENV: production
      AUTH_COOKIE_SECURE: true
      REQUIRE_API_KEY: true
      NEXT_PUBLIC_BASE_URL: ${OMNIROUTE_BASE_URL}
      BASE_URL: ${OMNIROUTE_BASE_URL}
    volumes:
      - ./data/omniroute:/data
    networks:
      - lan

  nextcloud:
    image: nextcloud:apache
    container_name: nextcloud
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${NEXTCLOUD_HTTP_PORT}:80"
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: nextcloud-db
      POSTGRES_DB: ${NEXTCLOUD_DB_NAME}
      POSTGRES_USER: ${NEXTCLOUD_DB_USER}
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      REDIS_HOST: nextcloud-redis
      REDIS_HOST_PASSWORD: ${NEXTCLOUD_REDIS_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS}
      TRUSTED_PROXIES: ${NEXTCLOUD_TRUSTED_PROXIES}
      OVERWRITEPROTOCOL: https
      OVERWRITECLIURL: ${NEXTCLOUD_OVERWRITE_CLI_URL}
    volumes:
      - ./data/nextcloud/html:/var/www/html
      - ./data/nextcloud/data:/var/www/html/data
    networks:
      - lan
      - nextcloud-internal

  nextcloud-cron:
    image: nextcloud:apache
    container_name: nextcloud-cron
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_healthy
    entrypoint: /cron.sh
    volumes:
      - ./data/nextcloud/html:/var/www/html
      - ./data/nextcloud/data:/var/www/html/data
    networks:
      - lan
      - nextcloud-internal

  nextcloud-db:
    image: postgres:16-alpine
    container_name: nextcloud_db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${NEXTCLOUD_DB_NAME}
      POSTGRES_USER: ${NEXTCLOUD_DB_USER}
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NEXTCLOUD_DB_USER} -d ${NEXTCLOUD_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./data/nextcloud_db:/var/lib/postgresql/data
    networks:
      - nextcloud-internal

  nextcloud-redis:
    image: redis:7-alpine
    container_name: nextcloud-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: redis-server --requirepass ${NEXTCLOUD_REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${NEXTCLOUD_REDIS_PASSWORD} ping | grep PONG"] 
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./data/nextcloud_redis:/data
    networks:
      - nextcloud-internal

networks:
   lan:
     name: lan
     driver: bridge
   nextcloud-internal:
     name: nextcloud-internal
     driver: bridge
     internal: true
